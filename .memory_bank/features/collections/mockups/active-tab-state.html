<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collections Active Tab Preview</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  color: #d3cfc5;
  background: #161716;
  font: 16px "Trebuchet MS", Arial, sans-serif;
}
.journal {
  width: min(700px, calc(100vw - 32px));
  min-height: 220px;
  padding: 18px 20px;
  border: 2px solid #827455;
  border-radius: 12px;
  background: linear-gradient(110deg, #292a29, #30302f);
  box-shadow: inset 0 0 0 2px #151615, 0 4px 18px #0009;
}
.title {
  margin: 0 0 10px;
  padding: 0 8px 8px;
  border-bottom: 1px solid #77746b;
  color: #ddd9ce;
  font-size: 30px;
  font-weight: 400;
}
.tabs {
  display: flex;
  gap: 8px;
  padding: 0 4px;
}
.tab {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 46px;
  display: grid;
  place-items: center;
  color: #eeeae2;
  background: linear-gradient(180deg, #62615e 0%, #41413f 46%, #292a29 100%);
  clip-path: polygon(12% 0, 94% 0, 100% 50%, 94% 100%, 8% 100%, 0 50%);
  font-size: 21px;
  letter-spacing: .3px;
  text-shadow: 0 1px 2px #000;
}
.tab::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 50%;
  width: 15px;
  height: 11px;
  transform: translateY(-50%) rotate(35deg);
  background: #77746b;
  clip-path: polygon(0 0, 100% 18%, 72% 100%, 16% 78%);
}
.tab.selected::before {
  background: linear-gradient(135deg, #fff39a, #ffc32e 55%, #c47812);
  filter: drop-shadow(0 0 3px #f4ae22);
}
.content {
  height: 86px;
  margin-top: 20px;
  border-top: 1px solid #77746b;
  opacity: .7;
}
</style>
</head>
<body>
<main class="journal" aria-label="Collections active tab preview">
  <h1 class="title">Mounts</h1>
  <nav class="tabs" aria-label="Collections tabs">
    <div class="tab selected">Mounts</div>
    <div class="tab">Pet Journal</div>
    <div class="tab">Toy Box</div>
  </nav>
  <div class="content" aria-hidden="true"></div>
</main>
</body>
</html>
