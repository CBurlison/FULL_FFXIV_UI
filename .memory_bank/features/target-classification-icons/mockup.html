<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FFXIV UI Target Classification Icons Mockup</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .target-frame-container {
            position: relative;
            width: 650px;
            height: 50px;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #555;
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .classification-icon {
            width: 32px;
            height: 32px;
            margin-right: 12px;
            background: #333;
            border: 1px solid #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #ffcc00;
        }
        .target-bar {
            flex-grow: 1;
            height: 24px;
            background: #2a2a2a;
            position: relative;
            overflow: hidden;
        }
        .target-fill {
            width: 75%;
            height: 100%;
            background: #c83208;
        }
        .target-info {
            position: absolute;
            left: 54px;
            display: flex;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>
    <h1>Target Classification Icons Mockup</h1>
    
    <div style="display: flex; flex-direction: column; gap: 20px;">
        <div>
            <p>Normal Enemy</p>
            <div class="target-frame-container">
                <div class="classification-icon" title="Normal">N</div>
                <div class="target-bar"><div class="target-fill"></div></div>
                <div class="target-info"><span>L</span><span>v</span><span>60</span><span>Target Name (Normal)</span></div>
            </div>
        </div>

        <div>
            <p>Elite Enemy</p>
            <div class="target-frame-container">
                <div class="classification-icon" title="Elite" style="border-color: gold;">E</div>
                <div class="target-bar"><div class="target-fill"></div></div>
                <div class="target-info"><span>L</span><span>v</span><span>63+</span><span>Target Name (Elite)</span></div>
            </div>
        </div>

        <div>
            <p>Rare Enemy</p>
            <div class="target-frame-container">
                <div class="classification-icon" title="Rare" style="border-color: cyan;">R</div>
                <div class="target-bar"><div class="target-fill"></div></div>
                <div class="target-info"><span>L</span><span>v</span><span>60</span><span>Target Name (Rare)</span></div>
            </div>
        </div>

        <div>
            <p>Boss Enemy</p>
            <div class="target-frame-container">
                <div class="classification-icon" title="Boss" style="border-color: orange;">B</div>
                <div class="target-bar"><div class="target-fill" style="width: 100%;"></div></div>
                <div class="target-info"><span>L</span><span>v</span><span>??</span><span>Raid Boss</span></div>
            </div>
        </div>

        <div>
            <p>Rare Boss Enemy</p>
            <div class="target-frame-container">
                <div class="classification-icon" title="Rare Boss" style="border-color: purple;">RB</div>
                <div class="target-bar"><div class="target-fill" style="width: 100%;"></div></div>
                <div class="target-info"><span>L</span><span>v</span><span>??</span><span>Rare Boss</span></div>
            </div>
        </div>
    </div>
</body>
</html>
