[package]
name = "ffxiv-updater"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "FFXIV_UI_Updater"
path = "src/main.rs"

[dependencies]
ureq = "2"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
